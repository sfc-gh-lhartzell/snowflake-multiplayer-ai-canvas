version: 2

name: AGENT_CANVAS_PLUS_APP
database: AGENT_CANVAS_PLUS
schema: PUBLIC
query_warehouse: AGENT_CANVAS_PLUS_WH

label: Agent Canvas Plus (Co-CoCo)
description: Multiplayer docs, slides, and artifacts with Luke, a Cortex Agent (caller rights for approved SQL).

ignore:
  - node_modules
  - .next
  - .git
  - .env*
  # local dev key pair and scratch data: never upload
  - .dev-keys
  - .data
  - "**/*.p8"
  - "**/*.pem"
  - "*.tsbuildinfo"
  - "**/.DS_Store"
  - server.js
  - assets

install:
  commands:
    # --include=dev because Tailwind v4 and TS compiler are devDeps that the
    # production build still needs. The remote builder sets NODE_ENV=production.
    - [npm, ci, --include=dev]

build:
  commands:
    - [npm, run, build]
    # Next.js standalone output: copy static + public into the standalone dir.
    # public/ copy uses sh -c with a guard so an empty public/ doesn't fail.
    - [cp, -r, .next/static, .next/standalone/.next/static]
    - [sh, -c, "if [ -d public ] && [ \"$(ls -A public)\" ]; then cp -r public .next/standalone/public; fi"]
    - [rm, -rf, node_modules]

run:
  command: [node, .next/standalone/server.js]

auto_resume: true
auto_suspend_secs: 900

min_instances: 1
max_instances: 1
